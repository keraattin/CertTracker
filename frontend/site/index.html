<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <!-- Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css">

    <title>Cert Tracker</title>
  </head>
  <body onload="getDashboard()">
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="/">Cert Tracker<i class="bi bi-shield-check"></i></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/dnsrecords.html">DnsRecords</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/certificates.html">Certificates</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <div class="container-fluid">
      <!-- Summary Cards -->
      <div class="row mt-3">
        <div class="col-sm-6 col-lg-3 mb-3">
          <a href="/certificates.html" class="text-decoration-none">
            <div class="card text-white bg-success h-100">
              <div class="card-body">
                <h2 class="card-title" id="summaryValid">-</h2>
                <p class="card-text">Valid</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-sm-6 col-lg-3 mb-3">
          <a href="/certificates.html" class="text-decoration-none">
            <div class="card text-dark bg-warning h-100">
              <div class="card-body">
                <h2 class="card-title" id="summaryExpiring">-</h2>
                <p class="card-text">Expiring within 30 days</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-sm-6 col-lg-3 mb-3">
          <a href="/certificates.html" class="text-decoration-none">
            <div class="card text-white bg-danger h-100">
              <div class="card-body">
                <h2 class="card-title" id="summaryExpired">-</h2>
                <p class="card-text">Expired</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-sm-6 col-lg-3 mb-3">
          <a href="/certificates.html" class="text-decoration-none">
            <div class="card text-white bg-dark h-100">
              <div class="card-body">
                <h2 class="card-title" id="summaryFailed">-</h2>
                <p class="card-text">Last check failed</p>
              </div>
            </div>
          </a>
        </div>
      </div>

      <div class="row">
        <p class="text-muted" id="summaryTracked"></p>
      </div>

      <!-- Needs Attention -->
      <div class="row">
        <div class="table-responsive-sm">
          <p class="text-success" id="attentionEmpty" hidden>Nothing needs attention right now.</p>
          <table id="attentionTable" class="table table-hover table-striped table-sm caption-top" hidden>
            <caption>Certificates that expire soon, already expired, or could not be checked. Times are shown in <span class="local-timezone"></span></caption>
            <thead class="table-dark">
              <tr>
                <th>
                  DNS
                  <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="DNS record or Ip adress">
                    <i class="bi bi-info-circle"></i>
                  </span>
                </th>
                <th>
                  SSL Port
                  <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="SSL port of target">
                    <i class="bi bi-info-circle"></i>
                  </span>
                </th>
                <th>
                  Not After
                  <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="Not valid after this date">
                    <i class="bi bi-info-circle"></i>
                  </span>
                </th>
                <th>
                  Remaining Day
                  <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="Not valid after day/s">
                    <i class="bi bi-info-circle"></i>
                  </span>
                </th>
                <th>
                  Last Check
                  <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" title="Last check attempt, successful or not">
                    <i class="bi bi-info-circle"></i>
                  </span>
                </th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <!-- Sweet Alert JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Datetime JS -->
    <script src="js/datetime.js"></script>

    <!-- Main JS -->
    <script src="js/main.js"></script>

  </body>
</html>
