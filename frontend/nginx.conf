server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The api is reached through this server, so the browser only ever
    # talks to one origin. Without it the frontend has to carry the api
    # address in its javascript, which pins the whole project to
    # localhost and makes it undeployable anywhere else.
    location /api {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
    }
}
