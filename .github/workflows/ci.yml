name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same version the image runs on, so a test passing here means the
      # same thing it means in the container.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Run tests
        working-directory: api
        # Verbose with tracebacks: the log is the only place a failure
        # here can be read from, and job logs are not public.
        run: pytest -v --tb=short

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The images are built from pinned requirements, so a build failure
      # here means a pin no longer installs.
      - name: Build the images
        run: docker compose build

      # Building only proves the pins install, not that the thing runs.
      # An entrypoint carrying CRLF line endings built perfectly and then
      # died at startup, the carriage return having become part of the
      # module name waitress was asked to import.
      # Addressed as 127.0.0.1 throughout: localhost resolves to ::1
      # first on some hosts, and published ports are not always bound on
      # IPv6, which fails in a way that looks like the app is broken.
      - name: Start the stack and check it answers
        run: |
          docker compose up -d --wait
          docker compose ps
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/api/dns
          curl -fsS http://127.0.0.1:5000/health

      - name: Show what happened if it did not
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
