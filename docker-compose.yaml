services:
    api:
      build: ./api
      ports:
        - "5000:5000"
      volumes:
        - './api/Database:/api/Database'
        - './api/Logs:/api/Logs'
      # Mail notifications stay off until SMTP_HOST, MAIL_FROM and MAIL_TO
      # are set. Uncomment and fill in to enable them.
      # environment:
      #   SMTP_HOST: "smtp.example.com"
      #   SMTP_PORT: "587"
      #   SMTP_USER: "certtracker@example.com"
      #   SMTP_PASSWORD: "change-me"
      #   SMTP_TLS: "True"
      #   MAIL_FROM: "certtracker@example.com"
      #   MAIL_TO: "ops@example.com,oncall@example.com"
      #   NOTIFY_DAYS: "30,14,7,1"
      healthcheck:
        test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 10s
    frontend:
      build: ./frontend
      ports:
        - "8080:80"
      # nginx resolves the api hostname once, when it starts, so it must
      # not come up before the api is answering.
      depends_on:
        api:
          condition: service_healthy
